name: mnd_rider
description: MND Rider — production delivery driver app (jobs, trips, earnings).
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  google_fonts: ^6.3.0
  shared_preferences: ^2.5.3

  firebase_core: ^3.13.1
  firebase_auth: ^5.5.4
  cloud_firestore: ^5.6.8
  firebase_storage: ^12.4.10
  firebase_messaging: ^15.2.6
  flutter_local_notifications: ^19.0.0

  google_maps_flutter: ^2.17.0
  geolocator: ^14.0.2
  permission_handler: ^12.0.1

  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  package_info_plus: ^8.3.0
  fl_chart: ^0.70.2
  intl: ^0.20.2
  cloud_functions: ^5.6.2
  lottie: ^3.3.3
  pdf: ^3.12.0
  printing: ^5.14.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/branding/app_icon.png
  adaptive_icon_background: "#F5F5F5"
  adaptive_icon_foreground: assets/images/branding/app_icon.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/animations/delivery_bike.json
    - assets/images/onboarding/
    - assets/images/branding/app_icon.png
    - assets/vehicles/
