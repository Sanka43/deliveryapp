org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djava.net.preferIPv4Stack=true
android.useAndroidX=true

# Gradle build performance (shared: mnd_rider, mnd_customer, mnd_shop)
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.daemon=true

# Prefer IPv4 — intermittent "No such host" / Maven download failures on Windows often come from broken IPv6 DNS paths
systemProp.java.net.preferIPv4Stack=true
systemProp.java.net.preferIPv6Addresses=false

# Longer network timeouts for flaky DNS/CDN
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
org.gradle.internal.repository.max.retries=5
org.gradle.internal.repository.initial.backoff=1000

# Kotlin / AGP — Flutter migrator flags (stable on Windows + heavy plugins)
kotlin.compiler.execution.strategy=in-process
android.builtInKotlin=false
android.newDsl=false
android.enableR8.fullMode=false
android.nonTransitiveRClass=true

# Incremental Kotlin — requires PUB_CACHE on E: (setx PUB_CACHE "E:\pub-cache"); set false if compile errors persist
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
