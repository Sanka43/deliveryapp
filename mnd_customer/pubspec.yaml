name: mnd_delivery_app
description: MND Delivery App built with Clean Architecture.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  equatable: ^2.0.7
  flutter_riverpod: ^2.6.1
  go_router: ^16.0.0
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.4
  cloud_firestore: ^5.6.8
  firebase_storage: ^12.4.10
  firebase_messaging: ^15.2.6
  image_picker: ^1.1.2
  shared_preferences: ^2.5.3
  shimmer: ^3.0.0
  carousel_slider: ^5.0.0
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1
  json_annotation: ^4.9.0
  google_maps_flutter: ^2.17.0
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  web: ^1.1.1
  url_launcher: ^6.3.1
  webview_flutter: ^4.10.0
  file_picker: ^8.1.7
  cloud_functions: ^5.6.2
  package_info_plus: ^9.0.1
  payhere_mobilesdk_flutter: ^3.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  json_serializable: ^6.9.5
  flutter_launcher_icons: ^0.14.3

# google_maps_flutter_web 0.6.2+3's GoogleMapsPlugin.dispose() has an
# unguarded event-listener cancellation that throws when the map's JS view
# was already torn down (e.g. a fast picker push/pop) — google_maps_flutter
# calls dispose() fire-and-forget, so this surfaces as an uncaught async
# error and can leave the map's overlays (markers/route line) in a stale
# state. Vendored copy in third_party/ wraps the cancellations in
# try/catch; see that file for details.
dependency_overrides:
  google_maps_flutter_web:
    path: third_party/google_maps_flutter_web

flutter:
  uses-material-design: true
  assets:
    - google_fonts/
    - assets/app_icon.png
    - assets/animations/delivery_bike.json
    - assets/images/categories/category_food.png
    - assets/images/categories/category_groceries.png
    - assets/images/categories/category_ride.png
    - assets/images/categories/category_jobs.png
    - assets/images/dishes/rice_curry.png
    - assets/images/dishes/fried_rice.png
    - assets/images/dishes/kottu.png
    - assets/images/dishes/pasta.png
    - assets/images/dishes/noodles.png
    - assets/images/dishes/beverages.png
    - assets/images/dishes/desert.png
    - assets/images/dishes/shot_eats.png
    - assets/images/rides/vehicle_car.png
    - assets/images/rides/vehicle_bike.png
    - assets/images/rides/vehicle_wheel.png
    - assets/vehicles/
    - assets/images/onboarding/order.jpg
    - assets/images/onboarding/track.jpg
    - assets/images/onboarding/more.jpg
    - assets/images/auth/login_hero.jpg

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  image_path: assets/app_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/app_icon.png
