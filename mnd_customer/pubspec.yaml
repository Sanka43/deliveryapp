name: mnd_delivery_app
description: MND Delivery App built with Clean Architecture.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  equatable: ^2.0.7
  flutter_riverpod: ^2.6.1
  go_router: ^16.0.0
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.4
  cloud_firestore: ^5.6.8
  firebase_storage: ^12.4.10
  firebase_messaging: ^15.2.6
  image_picker: ^1.1.2
  shared_preferences: ^2.5.3
  google_sign_in: ^6.2.2
  shimmer: ^3.0.0
  carousel_slider: ^5.0.0
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1
  json_annotation: ^4.9.0
  google_maps_flutter: ^2.17.0
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  url_launcher: ^6.3.1
  file_picker: ^8.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  json_serializable: ^6.9.5
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png
    - assets/images/categories/category_food.png
    - assets/images/categories/category_groceries.png
    - assets/images/categories/category_ride.png
    - assets/images/categories/category_jobs.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/app_icon.png
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/app_icon.png
