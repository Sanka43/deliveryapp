<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Master N Delivery — food, groceries, rides, and jobs in Badulla.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MND Delivery">
  <meta name="theme-color" content="#1463FF">
  <!-- Force light color-scheme so OS dark mode does not invert form controls / canvas. -->
  <meta name="color-scheme" content="light">

  <!-- Warm connections used during Flutter / CanvasKit boot (not unused API preconnects). -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://maps.googleapis.com" crossorigin>
  <link rel="dns-prefetch" href="//maps.googleapis.com">
  <link rel="dns-prefetch" href="//fonts.gstatic.com">
  <link rel="dns-prefetch" href="//firebasestorage.googleapis.com">

  <link rel="preload" as="image" href="icons/Icon-192.png?v=6" fetchpriority="high">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=6">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png?v=6">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=6"/>

  <title>MND Delivery</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      color-scheme: light;
      /* Match splash so slow mobiles never flash a bare white page. */
      background:
        radial-gradient(circle at 50% 38%, rgba(20, 99, 255, 0.12), transparent 34%),
        linear-gradient(180deg, #e5f0ff 0%, #f8fbff 48%, #ffffff 100%);
    }

    #mnd-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 50% 38%, rgba(20, 99, 255, 0.12), transparent 34%),
        linear-gradient(180deg, #e5f0ff 0%, #f8fbff 48%, #ffffff 100%);
      color: #101828;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      transition: opacity 220ms ease, visibility 220ms ease;
    }

    #mnd-splash.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .mnd-splash-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      padding: 32px;
      text-align: center;
    }

    .mnd-splash-logo {
      width: 108px;
      height: 108px;
      border-radius: 24px;
      box-shadow: 0 18px 42px rgba(10, 46, 115, 0.16);
    }

    .mnd-splash-title {
      margin: 0;
      font-size: 24px;
      font-weight: 800;
      line-height: 1.1;
    }

    .mnd-splash-status {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #667085;
      font-size: 14px;
      font-weight: 700;
    }

    .mnd-splash-spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(20, 99, 255, 0.18);
      border-top-color: #1463ff;
      border-radius: 50%;
      animation: mnd-spin 780ms linear infinite;
    }

    @keyframes mnd-spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Firebase Phone Auth injects Google reCAPTCHA; the default badge floats
       over the bottom nav (covers Settings). Hide it — branding stays on login
       + Privacy Policy per Google reCAPTCHA terms. */
    .grecaptcha-badge {
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }
  </style>
</head>
<body>
  <div id="mnd-splash" role="status" aria-live="polite">
    <div class="mnd-splash-content">
      <img
        class="mnd-splash-logo"
        src="icons/Icon-192.png?v=6"
        width="108"
        height="108"
        alt="MND Delivery"
        fetchpriority="high"
        decoding="async"
      >
      <h1 class="mnd-splash-title">MND Delivery</h1>
      <div class="mnd-splash-status">
        <span class="mnd-splash-spinner" aria-hidden="true"></span>
        <span>Loading</span>
      </div>
    </div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    /* Capture install prompt early — before Flutter boots. */
    (function () {
      window.__mndDeferredInstallPrompt = null;

      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__mndDeferredInstallPrompt = e;
      });

      window.addEventListener('appinstalled', function () {
        window.__mndDeferredInstallPrompt = null;
      });

      window.__mndIsStandalone = function () {
        try {
          if (window.matchMedia('(display-mode: standalone)').matches) {
            return true;
          }
          if (window.matchMedia('(display-mode: fullscreen)').matches) {
            return true;
          }
          if (window.matchMedia('(display-mode: minimal-ui)').matches) {
            return true;
          }
        } catch (_) {}
        return window.navigator.standalone === true;
      };

      window.__mndCanPromptInstall = function () {
        return window.__mndDeferredInstallPrompt != null;
      };

      window.__mndPromptInstall = function () {
        var deferred = window.__mndDeferredInstallPrompt;
        if (!deferred) {
          return Promise.resolve({ outcome: 'unavailable' });
        }
        return deferred.prompt().then(function () {
          return deferred.userChoice;
        }).then(function (choice) {
          window.__mndDeferredInstallPrompt = null;
          return choice || { outcome: 'dismissed' };
        }).catch(function () {
          return { outcome: 'dismissed' };
        });
      };
    })();
  </script>
  <script>
    (function () {
      // Bump when shipping boot/splash fixes so mobiles drop stale SW caches.
      var cacheResetKey = 'mnd-web-cache-reset-v15';
      var firstFrameSeen = false;

      function clearOldAppCache() {
        if (!('serviceWorker' in navigator) ||
            sessionStorage.getItem(cacheResetKey) === 'done') {
          return Promise.resolve(false);
        }
        if (!navigator.serviceWorker.controller) {
          sessionStorage.setItem(cacheResetKey, 'done');
          return Promise.resolve(false);
        }
        sessionStorage.setItem(cacheResetKey, 'done');
        var clearCaches = window.caches
          ? caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (key) {
                return caches.delete(key);
              }));
            }).catch(function () {})
          : Promise.resolve();
        return Promise.all([
          navigator.serviceWorker.getRegistrations().then(function (registrations) {
            return Promise.all(registrations.map(function (registration) {
              return registration.unregister();
            }));
          }).catch(function () {}),
          clearCaches
        ]).then(function () {
          location.replace(location.pathname + location.search + location.hash);
          return true;
        });
      }

      function hideSplash() {
        var splash = document.getElementById('mnd-splash');
        if (!splash || splash.classList.contains('is-hidden')) {
          return;
        }
        splash.classList.add('is-hidden');
        window.setTimeout(function () {
          splash.remove();
        }, 260);
      }

      function setSplashStatus(html) {
        var splash = document.getElementById('mnd-splash');
        if (!splash) {
          return;
        }
        var status = splash.querySelector('.mnd-splash-status');
        if (!status) {
          return;
        }
        status.innerHTML = html;
      }

      function showLoadError(message) {
        setSplashStatus(
          '<span style="color:#dc2626;font-weight:800;">' +
          message +
          '</span><button type="button" style="margin-left:10px;padding:8px 14px;border:0;border-radius:8px;background:#1463ff;color:#fff;font-weight:700;cursor:pointer;" onclick="location.reload()">Retry</button>'
        );
      }

      function loadBootstrap() {
        var bootstrap = document.createElement('script');
        bootstrap.src = 'flutter_bootstrap.js?v=20260807-2';
        bootstrap.async = true;
        bootstrap.onerror = function () {
          showLoadError('Could not load app resources.');
        };
        document.body.appendChild(bootstrap);
      }

      // Only leave the branded splash after Flutter paints — never on a timer.
      // Slow mobiles (big CanvasKit + main.dart.js) used to hit a 20s hide and
      // sit on a blank page until login finally appeared.
      window.addEventListener('flutter-first-frame', function () {
        firstFrameSeen = true;
        hideSplash();
      });

      window.addEventListener('error', function (event) {
        var target = event.target || event.srcElement;
        if (target && target.tagName === 'SCRIPT') {
          showLoadError('App failed to load.');
        }
      }, true);

      window.setTimeout(function () {
        if (firstFrameSeen || !document.getElementById('mnd-splash')) {
          return;
        }
        setSplashStatus(
          '<span class="mnd-splash-spinner" aria-hidden="true"></span>' +
          '<span>Still loading — mobile can take a bit…</span>'
        );
      }, 12000);

      window.setTimeout(function () {
        if (firstFrameSeen || !document.getElementById('mnd-splash')) {
          return;
        }
        showLoadError('Taking too long to load.');
      }, 90000);

      clearOldAppCache().then(function (reloading) {
        if (!reloading) {
          loadBootstrap();
        }
      });
    })();
  </script>
</body>
</html>
