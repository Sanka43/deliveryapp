name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  functions:
    name: functions (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  mnd_customer:
    name: mnd_customer (analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mnd_customer
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Some bugs (e.g. dart2js truncating bitwise-NOT to an unsigned
      # 32-bit result) only appear once compiled to JS for web — a VM-only
      # `flutter test` run above does not exercise that code path. This
      # recompiles the same tests to JS and runs them in real Chrome.
      - run: xvfb-run -a flutter test --platform chrome
