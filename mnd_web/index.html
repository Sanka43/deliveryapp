<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1463FF" />
    <meta name="description" content="MND operations admin — sign in" />
    <title>MND Admin — Sign in</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon.png" type="image/png" sizes="32x32" />
    <link rel="shortcut icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="css/tokens.css?v=admin-redesign-phase1" />
    <link rel="stylesheet" href="css/base.css?v=admin-redesign-phase1" />
    <link rel="stylesheet" href="css/components.css?v=admin-redesign-phase1" />
    <link rel="stylesheet" href="css/utilities.css?v=admin-redesign-phase1" />
    <link rel="stylesheet" href="css/styles.css?v=admin-redesign-phase1" />
  </head>
  <body class="login-page">
    <div id="login-screen" class="login-wrap">
      <div class="login-shell">
        <div class="login-brand">
          <div class="login-logo" aria-hidden="true">MND</div>
          <h1>Master N Delivery</h1>
          <p>Operations console</p>
        </div>
        <div class="login-card">
          <h2>Sign in</h2>
          <p class="login-hint">
            Use your admin email. Firestore <code>customers/{uid}</code> must include
            <code>role: &quot;admin&quot;</code>.
          </p>
          <form id="login-form">
            <div class="form-group">
              <label for="login-email">Email</label>
              <input id="login-email" type="email" autocomplete="username" required placeholder="admin@example.com" />
            </div>
            <div class="form-group">
              <label for="login-pass">Password</label>
              <input id="login-pass" type="password" autocomplete="current-password" required />
            </div>
            <button type="submit" class="btn btn-primary">Sign in</button>
          </form>
          <div id="login-error" class="login-error" role="alert"></div>
        </div>
      </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/firebase-boot.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
